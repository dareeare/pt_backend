# ===============================
# SPRING BOOT CONFIGURATION
# ===============================
spring.application.name=medical-center-userservice
server.port=8081

# ===============================
# DATABASE CONFIGURATION
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5433/medicalcenter
spring.datasource.username=postgres
spring.datasource.password=sjsjsqo18ha5
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ===============================
# SWAGGER/OPENAPI CONFIGURATION
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.validator-url=
springdoc.cache.disabled=true

# ===============================
# CUSTOM APPLICATION PROPERTIES
# ===============================
medicalcenter.openapi.dev-url=http://localhost:8081
medicalcenter.openapi.prod-url=https://medicalcenter-api.com

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.file.name=logs/userservice/userservice.log
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.max-file-size=5MB
logging.level.medicalcenter.userservice=DEBUG
logging.level.medicalcenter.userservice.clientlog=INFO
logging.level.org.springdoc=INFO

# ===============================
# PROFILES
# ===============================
spring.profiles.active=dev

# Feature flags
chat.enabled=false

# ===============================
# SECURITY CONFIGURATION
# ===============================
